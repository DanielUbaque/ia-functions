services:
  api:
    build: .
    ports:
      - "${WEB_PORT:-8001}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  mcp-backend:
    build: .
    command: python -m mcp_server
    ports:
      - "${MCP_PORT:-8002}:8000"
    environment:
      MCP_PORT: 8000
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      # host.docker.internal no resuelve nativo en Linux (sí en Docker
      # Desktop de Mac/Windows); este mapeo lo hace funcionar también en
      # el servidor de producción.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mcp_server:/app/mcp_server

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colflux}
      POSTGRES_DB: ${POSTGRES_DB:-colflux_ia}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colflux} -d ${POSTGRES_DB:-colflux_ia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  ollama_data:
